<!DOCTYPE html>
<html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#14171A"><title>Scheda Allenamento</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><style>:root{--bg:#12151A;--panel:#1D2229;--panel2:#262C34;--line:#333A44;--text:#F2F1ED;--dim:#9AA2AC;--work:#FF6B4A;--rest:#43C9BE;--gold:#F2B84B}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#232a33 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:480px;margin:auto;padding:28px 18px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700}h1{font-size:34px;margin:8px 0 24px;text-transform:uppercase}.card{position:relative;background:linear-gradient(155deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:20px;padding:20px;margin:16px 0;cursor:pointer}.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:20px 0 0 20px;background:var(--accent)}.card h2{margin:0;font-size:26px;text-transform:uppercase}.focus{color:var(--dim);font-size:13px;margin-top:6px}.meta{color:var(--dim);font-size:12px;margin-top:14px}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:50%;width:46px;height:46px;font-size:18px}.badge{text-align:center;margin:20px auto 8px;text-transform:uppercase;letter-spacing:2px;color:var(--work);font-weight:800}.timer{width:280px;height:280px;border:10px solid var(--work);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:18px auto;font-size:58px;font-weight:800}.name{text-align:center;font-size:26px;font-weight:800;text-transform:uppercase;min-height:62px}.cue,.next{text-align:center;color:var(--dim);font-size:13px;line-height:1.5;margin:10px auto;max-width:340px}.controls{display:flex;justify-content:center;gap:18px;margin-top:28px}.controls .main{width:70px;height:70px;background:var(--text);color:#14171A}.info{border:1px dashed var(--line);border-radius:16px;padding:16px;color:var(--dim);font-size:13px;line-height:1.5;margin-top:24px}</style></head><body><div class="app"><section id="home"><div class="eyebrow">Ciclo 6 settimane · Calisthenics + Tabata</div><h1>Scheda Allenamento</h1><div id="cards"></div><div class="info">Timer automatico per lavoro e recupero, voce, suono e vibrazione. Durante l'allenamento l'app prova a mantenere lo schermo acceso.</div></section><section id="work" class="hidden"><div class="top"><button class="btn" id="exit">✕</button><b id="day"></b><button class="btn" id="mute">🔊</button></div><div class="badge" id="phase">Preparati</div><div class="timer" id="timer">00:10</div><div class="name" id="name">Preparati</div><div class="cue" id="cue"></div><div class="next" id="next"></div><div class="controls"><button class="btn" id="prev">⟲</button><button class="btn main" id="play">❚❚</button><button class="btn" id="skip">⟳</button></div></section></div><script>
const C={"Push-up":"Corpo in linea retta, gomiti a 45°, scendi controllato.","Dips alle Parallele":"Spalle basse, scendi controllato fino a 90° di gomito.","Pike Push-up":"Bacino alto, testa verso il pavimento, spinta su spalle e tricipiti.","Squat":"Schiena neutra, ginocchia in linea con le punte dei piedi.","Mountain Climber":"Plank stabile, ginocchia alternate verso il petto.","Burpees":"Squat, plank e salto esplosivo in alto.","Plank":"Corpo in linea retta, core e glutei attivi.","Reverse Crunch":"Ginocchia al petto sollevando il bacino.","Band Row":"Tira i gomiti indietro stringendo le scapole.","Lat Pulldown con Elastico":"Tira i gomiti verso il basso e i fianchi.","Band Face Pull":"Tira l'elastico verso il viso, gomiti alti.","Band Biceps Curl":"Gomiti fissi ai fianchi, curl controllato."};
const DAYS={lun:{name:"Lunedì · Push + Core",focus:"Petto · Spalle · Tricipiti · Addome",accent:"#FF6B4A",ex:["Push-up","Dips alle Parallele","Pike Push-up","Push-up","Dips alle Parallele","Mountain Climber","Plank","Reverse Crunch","Burpees","Mountain Climber"]},mer:{name:"Mercoledì · Gambe + Core",focus:"Gambe · Glutei · Core · Metabolico",accent:"#43C9BE",ex:["Squat","Squat","Mountain Climber","Squat","Reverse Crunch","Plank","Burpees","Mountain Climber"]},ven:{name:"Venerdì · Pull + Full Body",focus:"Schiena · Bicipiti · Spalle · Core",accent:"#6E8CFF",ex:["Band Row","Lat Pulldown con Elastico","Band Face Pull","Band Biceps Curl","Band Row","Push-up","Reverse Crunch","Plank","Burpees"]}};
let steps=[],i=0,start=0,paused=false,pauseAt=0,raf=null,muted=false,wake=null;
const $=id=>document.getElementById(id); Object.entries(DAYS).forEach(([k,d])=>{let x=document.createElement('div');x.className='card';x.style='--accent:'+d.accent;x.innerHTML='<h2>'+d.name.split(' · ')[0]+'</h2><div class="focus">'+d.focus+'</div><div class="meta">30 min · '+d.name.split(' · ')[1]+'</div>';x.onclick=()=>begin(k);$('cards').appendChild(x)});
function build(d){let a=[{p:'prep',n:'Preparati',s:10}];d.ex.forEach((n,j)=>{a.push({p:'work',n,s:j>=(d.ex.length-2)?20:40,c:C[n]||''});a.push({p:'rest',n:'Recupero',s:j>=(d.ex.length-2)?10:20})});return a}
async function lock(){try{if('wakeLock'in navigator&&document.visibilityState==='visible')wake=await navigator.wakeLock.request('screen')}catch(e){}} async function unlock(){try{if(wake){await wake.release();wake=null}}catch(e){}}
function speak(t){if(muted||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';speechSynthesis.speak(u)}
function begin(k){let d=DAYS[k];steps=build(d);i=0;$('home').classList.add('hidden');$('work').classList.remove('hidden');$('day').textContent=d.name;enter();lock()}
function enter(){let s=steps[i];$('phase').textContent=s.p==='work'?'Lavoro':s.p==='rest'?'Recupero':'Preparati';$('phase').style.color=s.p==='rest'?'var(--rest)':s.p==='prep'?'var(--gold)':'var(--work)';$('timer').style.borderColor=s.p==='rest'?'var(--rest)':s.p==='prep'?'var(--gold)':'var(--work)';$('name').textContent=s.n;$('cue').textContent=s.c|| (s.p==='rest'?'Recupera, respira e prepara il prossimo esercizio.':'L’allenamento sta per iniziare.');let nx=steps.slice(i+1).find(x=>x.p==='work');$('next').textContent=nx?'Prossimo: '+nx.n:'';start=performance.now();paused=false;$('play').textContent='❚❚';speak(s.n);if(!raf)tick()}
function tick(){raf=requestAnimationFrame(tick);if(paused)return;let s=steps[i],e=(performance.now()-start)/1000,r=Math.max(0,s.s-e);$('timer').textContent='00:'+String(Math.ceil(r)).padStart(2,'0');if(e>=s.s)next()}
function next(){if(i+1<steps.length){i++;enter()}else{unlock();alert('Allenamento completato 💪');quit()}}
function quit(){unlock();cancelAnimationFrame(raf);raf=null;$('work').classList.add('hidden');$('home').classList.remove('hidden')}
$('skip').onclick=next;$('prev').onclick=()=>{i=Math.max(0,i-1);enter()};$('exit').onclick=()=>{if(confirm('Uscire dall’allenamento?'))quit()};$('play').onclick=()=>{paused=!paused;if(paused){pauseAt=performance.now();$('play').textContent='▶';unlock()}else{start+=performance.now()-pauseAt;$('play').textContent='❚❚';lock()}};$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇':'🔊'};document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!paused&&!$('work').classList.contains('hidden'))lock()});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
